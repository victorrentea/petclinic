version: '3.8'

services:
  backend:
    build:
      context: ../petclinic-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
    healthcheck:
      # /api/owners is paged now. `size=1` keeps the probe honest (it still exercises the
      # controller, the repository and the DB) without re-running the pets/visits N+1 over
      # ten owners every 10 seconds, and grep proves the page envelope came back — a 200
      # with a bare array would mean the backend is serving the pre-paging contract.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/api/owners?page=0&size=1' | grep -q '\"totalElements\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - petclinic-test

  frontend:
    build:
      context: ../petclinic-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - petclinic-test

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /work
    volumes:
      - ./:/work
      - ./test-results:/work/test-results
    environment:
      - BASE_URL=http://frontend:8080
      - API_BASE_URL=http://backend:8080/api
      - CI=true
    command: sh -c "npm install && npx playwright test"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - petclinic-test

networks:
  petclinic-test:
    driver: bridge
