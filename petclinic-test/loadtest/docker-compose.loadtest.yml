# Owners-grid load test stack. Fully containerised: nothing binds a host port the dev
# stack already uses (5432 embedded Postgres, 8080 backend, 4200 Angular, 15432 latency
# proxy). Everything here is prefixed `loadtest-` so it is obvious what to clean up.
#
#   ./run-loadtest.sh 10000     # seed + measure
#
# NO IMAGES ARE BUILT. The Docker VM on this machine has ~0 bytes free and pruning the
# user's images or volumes is off limits, so the backend jar and the JMeter distribution
# are produced on the host and bind-mounted into one stock `eclipse-temurin:21-jre`.
# Compiling on the host is not the same as running a service on the host: no port is bound
# and no server starts there — the backend under test runs in `loadtest-backend`, and the
# load generator in `loadtest-jmeter`, exactly as required.
# `run-loadtest.sh` produces both artifacts before it brings the stack up.
name: loadtest-petclinic

services:
  db:
    image: postgres:16
    container_name: loadtest-db
    # The dev DB collates en_US.UTF-8, which is what makes text_pattern_ops necessary for
    # LIKE 'x%'. Reproduce it here or the prefix-search numbers would be a lie.
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
      LANG: en_US.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      # Throwaway database on a space-constrained Docker VM: cap WAL and skip the
      # durability work. Nothing here survives the run, and it keeps the bulk INSERT
      # from being a disk-flush benchmark instead of a data load.
      - -c
      - max_wal_size=256MB
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    # PGDATA on tmpfs. Two reasons, in order of importance:
    #  1. it keeps a throwaway 100k-row fixture out of the Docker VM's disk entirely,
    #  2. it removes storage latency from the measurement, so what is left to explain in
    #     the grid's response time is the application, not the disk.
    # uid/gid 999 and mode 0700 are what the postgres image's initdb insists on.
    tmpfs:
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0700,size=1500m
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  backend:
    image: eclipse-temurin:21-jre
    container_name: loadtest-backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../petclinic-backend/target/petclinic-backend-1.0.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
      # application.properties ships show-sql=true. Left on, every statement is printed to
      # stdout and the log writer, not the database, becomes the bottleneck.
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS: "false"
      JAVA_TOOL_OPTIONS: "-Xmx3g -Xms3g -XX:+UseG1GC"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
      LOGGING_LEVEL_ROOT: WARN
    ports:
      - "28080:8080"
    networks:
      - loadtest

  # JMeter runs from a host-extracted distribution on the same JRE image, so the load
  # generator is still a container but costs no image build and no VM disk.
  jmeter:
    image: eclipse-temurin:21-jre
    container_name: loadtest-jmeter
    working_dir: /work
    volumes:
      - ./.tools/apache-jmeter-5.6.3:/opt/jmeter:ro
      - ./jmx:/work/jmx:ro
      - ./results:/work/results
    environment:
      JVM_ARGS: "-Xms512m -Xmx1g"
    entrypoint: ["/opt/jmeter/bin/jmeter"]
    networks:
      - loadtest
    profiles: ["tools"]

networks:
  loadtest:
    name: loadtest-net
    driver: bridge
