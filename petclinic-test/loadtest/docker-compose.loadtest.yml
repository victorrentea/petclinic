# Owners-grid load test stack. Fully containerised: nothing binds a host port the dev
# stack already uses (5432 embedded Postgres, 8080 backend, 4200 Angular, 15432 latency
# proxy). Everything here is prefixed `loadtest-` so it is obvious what to clean up.
#
#   ./run-loadtest.sh 10000     # seed + measure
#
name: loadtest-petclinic

services:
  db:
    image: postgres:16
    container_name: loadtest-db
    # The dev DB collates en_US.UTF-8, which is what makes a plain btree unusable for
    # LIKE 'x%'. Reproduce it here or the prefix-search numbers would be a lie.
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
      LANG: en_US.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      # Throwaway database on a space-constrained Docker VM: cap WAL and skip the
      # durability work. Nothing here survives the run, and it keeps the bulk INSERT
      # from being a disk-flush benchmark instead of a data load.
      - -c
      - max_wal_size=256MB
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    # PGDATA on tmpfs. Two reasons, in order of importance:
    #  1. it keeps a throwaway 100k-row fixture out of the Docker VM's disk entirely,
    #  2. it removes storage latency from the measurement, so what is left to explain in
    #     the grid's response time is the application, not the disk.
    # uid/gid 999 and mode 0700 are what the postgres image's initdb insists on.
    tmpfs:
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0700,size=1500m
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - loadtest

  backend:
    build:
      # Same context as the shipped Dockerfile; only the Dockerfile differs, because the
      # shipped one forgets to COPY lombok.config — see the comment in Dockerfile.backend.
      context: ../../petclinic-backend
      dockerfile: ../petclinic-test/loadtest/Dockerfile.backend
    image: loadtest-petclinic-backend
    container_name: loadtest-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/petclinic
      SPRING_DATASOURCE_USERNAME: petclinic
      SPRING_DATASOURCE_PASSWORD: petclinic
      # application.properties ships show-sql=true. Left on, every row of an N+1 is
      # printed to stdout and the log writer, not the database, becomes the bottleneck.
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_USE_SQL_COMMENTS: "false"
      # A grid load has to hold 10k owners + pets + visits as entities and again as DTOs
      # and again as the serialised buffer. Pin the heap so an OOM is a finding, not noise.
      JAVA_TOOL_OPTIONS: "-Xmx3g -Xms3g -XX:+UseG1GC"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
      LOGGING_LEVEL_ROOT: WARN
    ports:
      - "28080:8080"
    networks:
      - loadtest

  # Native arm64/amd64 JMeter. The published jmeter images are amd64-only, and a load
  # generator running under QEMU emulation measures the emulator, not the server.
  jmeter:
    build:
      context: .
      dockerfile: Dockerfile.jmeter
    image: loadtest-jmeter
    container_name: loadtest-jmeter
    working_dir: /work
    volumes:
      - ./jmx:/work/jmx
      - ./results:/work/results
    environment:
      TARGET_HOST: backend
      TARGET_PORT: "8080"
    networks:
      - loadtest
    profiles: ["tools"]

networks:
  loadtest:
    name: loadtest-net
    driver: bridge
