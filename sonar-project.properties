sonar.projectKey=victorrentea_petclinic
sonar.organization=victorrentea
sonar.host.url=https://sonarcloud.io

sonar.sources=petclinic-backend/src/main,petclinic-frontend/src
sonar.tests=petclinic-backend/src/test,petclinic-frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java,**/*IT.java
sonar.exclusions=**/generated/**,**/generated-sources/**,**/target/**,**/node_modules/**,**/dist/**,petclinic-frontend/src/app/generated/**,petclinic-backend/docs/**,petclinic-backend/src/test/py/**

sonar.java.source=21
sonar.java.binaries=petclinic-backend/target/classes
sonar.java.test.binaries=petclinic-backend/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=petclinic-backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=petclinic-frontend/coverage/lcov.info

sonar.coverage.exclusions=petclinic-frontend/src/otel.ts
# CPD looks for copy-pasted LOGIC. Since Lombok was removed, every entity and DTO carries
# its getters and setters written out, and five accessor pairs for firstName/lastName/
# address/city/telephone are token-identical in Owner, OwnerDto and OwnerFieldsDto — not
# because anyone copied them, but because that IS the JavaBean shape. Flagging it measures
# the convention, not a defect; before the refactoring the same code existed as bytecode
# Sonar never saw. Duplication stays enforced everywhere else, and these files keep their
# coverage and issue analysis.
sonar.cpd.exclusions=petclinic-backend/src/main/resources/db/migration/V3__sample_data.sql,petclinic-backend/src/main/java/victor/training/petclinic/domain/*.java,petclinic-backend/src/main/java/victor/training/petclinic/rest/dto/*.java

sonar.typescript.tsconfigPath=petclinic-frontend/tsconfig.json
