sonar.projectKey=victorrentea_petclinic
sonar.organization=victorrentea
sonar.host.url=https://sonarcloud.io

sonar.sources=petclinic-backend/src/main,petclinic-frontend/src
sonar.tests=petclinic-backend/src/test,petclinic-frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*Tests.java,**/*IT.java
sonar.exclusions=**/generated/**,**/generated-sources/**,**/target/**,**/node_modules/**,**/dist/**,petclinic-frontend/src/app/generated/**,petclinic-backend/docs/**

sonar.java.source=21
sonar.java.binaries=petclinic-backend/target/classes
sonar.java.test.binaries=petclinic-backend/target/test-classes

sonar.coverage.jacoco.xmlReportPaths=petclinic-backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=petclinic-frontend/coverage/lcov.info

sonar.coverage.exclusions=petclinic-frontend/src/otel.ts
# Copy-paste detection off for the plain data holders. Since Lombok was removed, every
# entity and DTO carries its accessors in source, and `public X getY() { return y; }`
# repeated across seven classes is what CPD is built to find — it pushed new-code
# duplication to 8.7% against a 3% gate on a commit that added no logic at all. The
# duplication is structural, not a refactoring opportunity: two classes sharing a
# getFirstName are not sharing behaviour. Everything else stays under CPD.
sonar.cpd.exclusions=petclinic-backend/src/main/resources/db/migration/V3__sample_data.sql,\
  petclinic-backend/src/main/java/victor/training/petclinic/domain/**,\
  petclinic-backend/src/main/java/victor/training/petclinic/rest/dto/**

sonar.typescript.tsconfigPath=petclinic-frontend/tsconfig.json
