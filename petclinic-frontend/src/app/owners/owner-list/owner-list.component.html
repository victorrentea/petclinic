<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form class="form-horizontal" id="search-owner-form" (ngSubmit)="search()">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label" for="lastName">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName"/> <span class="help-inline"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default">Find Owner</button>
        </div>
      </div>
    </form>

    <div id="ownersError" class="alert alert-danger" role="alert" *ngIf="errorMessage">
      Could not load owners: {{ errorMessage }}
    </div>
    <div id="noOwners" *ngIf="noOwnersFound">No owners with last name starting with "{{ submittedLastName }}"</div>

    <ng-container *ngIf="!errorMessage && !noOwnersFound">
      <div class="table-responsive" id="ownersTable">
        <table class="table table-striped" matSort matSortActive="name" matSortDirection="asc" matSortDisableClear
          (matSortChange)="onSort($event)">
          <thead>
          <tr>
            <th mat-sort-header="name">Name</th>
            <th>Address</th>
            <th mat-sort-header="city">City</th>
            <th>Telephone</th>
            <th>Pets</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let owner of owners">
            <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active">{{ owner.firstName }} {{ owner.lastName }}</a></td>
            <td>{{ owner.address }}</td>
            <td>{{ owner.city }}</td>
            <td>{{ owner.telephone }}</td>
            <td>
              <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <!-- Outside .table-responsive: on a narrow screen the table scrolls sideways, the paginator does not -->
      <mat-paginator [length]="totalElements" [pageIndex]="pageIndex" [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions" [showFirstLastButtons]="true"
        (page)="onPage($event)"
        aria-label="Select page of owners">
      </mat-paginator>
    </ng-container>

    <div>
      <button id="addOwner" class="btn btn-default" routerLink="/owners/add">Add Owner</button>
    </div>
  </div>
</div>
