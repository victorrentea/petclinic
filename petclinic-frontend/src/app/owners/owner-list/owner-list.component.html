<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group" id="lastNameGroup">
        <label class="col-sm-2 control-label" for="lastName">Last name</label>
        <div class="col-sm-10 owner-search-row">
          <input class="form-control" size="30"
            maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
          <button type="submit" class="btn btn-default" (click)="search()">Find Owner</button>
          <button type="button" class="btn btn-default" (click)="addOwner()">Add Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="errorMessage" class="alert alert-danger" id="ownersError">{{ errorMessage }}</div>
    <div *ngIf="isOwnersDataReceived && !errorMessage && totalOwners === 0" id="noOwners">
      No owners with LastName starting with "{{ query.lastName }}"
    </div>

    <div class="table-responsive" id="ownersTable" [hidden]="totalOwners === 0">
      <table mat-table [dataSource]="owners" class="table table-striped"
              matSort [matSortActive]="sortKey" [matSortDirection]="sortDirection" matSortDisableClear
              (matSortChange)="onSort($event)">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let owner" class="ownerFullName">
            <a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
                (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a>
          </td>
        </ng-container>
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let owner">{{ owner.address }}</td>
        </ng-container>
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>City</th>
          <td mat-cell *matCellDef="let owner">{{ owner.city }}</td>
        </ng-container>
        <ng-container matColumnDef="telephone">
          <th mat-header-cell *matHeaderCellDef>Telephone</th>
          <td mat-cell *matCellDef="let owner">{{ owner.telephone }}</td>
        </ng-container>
        <ng-container matColumnDef="pets">
          <th mat-header-cell *matHeaderCellDef>Pets</th>
          <td mat-cell *matCellDef="let owner" class="ownerPets">{{ petNames(owner) }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let owner; columns: columns"></tr>
      </table>

      <mat-paginator [length]="totalOwners" [pageIndex]="query.page" [pageSize]="query.size"
                      [pageSizeOptions]="pageSizes" showFirstLastButtons
                      (page)="onPage($event)" aria-label="Owners pages"></mat-paginator>
    </div>
  </div>
</div>
