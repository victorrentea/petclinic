<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group" id="lastNameGroup">
        <label class="col-sm-2 control-label" for="lastName">Last name</label>
        <div class="col-sm-10 owner-search-row">
          <input class="form-control" size="30"
            maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
          <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)"><span
            class="glyphicon glyphicon-search" aria-hidden="true"></span> Search</button>
          <button type="button" id="addOwner" class="btn btn-default" (click)="addOwner()"><span
            class="glyphicon glyphicon-plus" aria-hidden="true"></span> Add Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="errorMessage" id="ownersError" class="alert alert-danger">{{ errorMessage }}</div>
    <div *ngIf="isEmpty" id="noOwners">No owners with last name starting with "{{ query.lastName }}"</div>

    <div *ngIf="hasOwners" class="table-responsive">
      <table mat-table id="ownersTable" class="table table-striped" [dataSource]="ownerPage.content"
        matSort matSortDisableClear [matSortActive]="sortActive" [matSortDirection]="sortDirection"
        (matSortChange)="onSortChange($event)">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="nameHeader">Name</th>
          <td mat-cell *matCellDef="let owner" class="ownerFullName">
            <a routerLink="/owners/{{ owner.id }}">{{ owner.lastName }}, {{ owner.firstName }}</a>
          </td>
        </ng-container>
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let owner">{{ owner.address }}</td>
        </ng-container>
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="cityHeader">City</th>
          <td mat-cell *matCellDef="let owner" class="ownerCity">{{ owner.city }}</td>
        </ng-container>
        <ng-container matColumnDef="telephone">
          <th mat-header-cell *matHeaderCellDef>Telephone</th>
          <td mat-cell *matCellDef="let owner">{{ owner.telephone }}</td>
        </ng-container>
        <ng-container matColumnDef="pets">
          <th mat-header-cell *matHeaderCellDef>Pets</th>
          <td mat-cell *matCellDef="let owner" class="ownerPets"><span
            *ngFor="let pet of owner.pets; let last = last">{{ pet.name }}{{ last ? '' : ', ' }}</span></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let owner; columns: columns"></tr>
      </table>
      <mat-paginator id="ownersPaginator" [length]="ownerPage.totalElements" [pageIndex]="query.page"
        [pageSize]="query.size" [pageSizeOptions]="pageSizes" showFirstLastButtons
        (page)="onPage($event)"></mat-paginator>
    </div>

  </div>
</div>
