<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form id="search-owner-form" class="owner-search" (ngSubmit)="searchByLastName(lastName)">
      <input class="form-control" id="lastName" name="lastName" maxlength="80" placeholder="Last name"
        aria-label="Last name" [(ngModel)]="lastName"/>
      <button type="submit" class="btn btn-default">Find Owner</button>
      <button type="button" class="btn btn-default" (click)="addOwner()">Add Owner</button>
    </form>

    <div *ngIf="page && page.totalElements === 0">No owners with LastName starting with "{{query.lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="page && page.totalElements > 0">
      <table class="table table-striped" matSort [matSortActive]="sortActive" [matSortDirection]="sortDirection"
        matSortDisableClear (matSortChange)="onSort($event)">
        <colgroup>
          <col class="col-name">
          <col class="col-address">
          <col class="col-city">
          <col class="col-telephone">
          <col class="col-pets">
        </colgroup>
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of page.content">
          <td class="ownerFullName" data-tip-truncated><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td data-tip-truncated>{{ owner.address }}</td>
          <td data-tip-truncated>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
            <div *ngFor="let pet of owner.pets">
              <span [attr.data-tip]="pet.type?.name">{{ pet.type?.name | petTypeEmoji }}</span> {{ pet.name }}
            </div>
          </td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="page.totalElements" [pageIndex]="page.number" [pageSize]="query.size"
        [pageSizeOptions]="pageSizes" showFirstLastButtons (page)="onPage($event)"
        aria-label="Owners pages"></mat-paginator>
    </div>
  </div>
</div>
