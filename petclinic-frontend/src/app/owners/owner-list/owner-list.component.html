<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/> <span class="help-inline"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find
            Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="page && page.totalElements === 0">No owners with LastName starting with "{{lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="page && page.totalElements > 0">
      <table class="table table-striped owners-grid" matSort matSortDisableClear
              [matSortActive]="sortKey" [matSortDirection]="sortDirection" (matSortChange)="sortBy($event)">
        <colgroup>
          <col class="col-name">
          <col class="col-address">
          <col class="col-city">
          <col class="col-telephone">
          <col class="col-pets">
        </colgroup>
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td class="ownerPets" [title]="petNames(owner)">{{ petNames(owner) }}</td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="page.totalElements" [pageIndex]="page.number" [pageSize]="query.size"
                      [pageSizeOptions]="pageSizes" (page)="changePage($event)" showFirstLastButtons>
      </mat-paginator>
    </div>
    <div>
      <button *ngIf="isOwnersDataReceived" class="btn btn-default" (click)="addOwner()">Add Owner</button>
    </div>
  </div>
</div>
