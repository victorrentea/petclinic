<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group owners-controls" id="lastNameGroup">
        <label class="control-label owner-search-label" for="lastName">Last name </label>
        <input class="form-control owner-search-input" size="30"
          maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
        <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find
          Owner</button>
      </div>
    </form>

    <div id="noOwnersFound" *ngIf="ownerPage?.totalElements === 0">No owners with LastName starting with "{{query.lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="ownerPage?.totalElements">
      <table class="table table-striped" matSort matSortDisableClear
        [matSortActive]="sortActive" [matSortDirection]="sortDirection" (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th mat-sort-header="city">City</th>
          <th>Address</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of ownerPage.content; trackBy: trackByOwnerId">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.firstName }} {{ owner.lastName }}</a></td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
        <tr *ngFor="let pet of owner.pets">
          {{ pet.name }}
        </tr>
        </td>
        </tr>
        </tbody>
      </table>
      <div class="owners-controls">
        <button class="btn btn-default" (click)="addOwner()">Add Owner</button>
        <mat-paginator [length]="ownerPage.totalElements" [pageIndex]="query.page" [pageSize]="query.size"
          [pageSizeOptions]="pageSizeOptions" (page)="onPage($event)"></mat-paginator>
      </div>
    </div>
    <div *ngIf="ownerPage && !ownerPage.totalElements">
      <button class="btn btn-default" (click)="addOwner()">Add Owner</button>
    </div>
  </div>
</div>
