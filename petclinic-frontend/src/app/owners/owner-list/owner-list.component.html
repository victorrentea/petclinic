<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/> <span class="help-inline"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find
            Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="isEmpty">No owners with LastName starting with "{{lastName}}"</div>

    <!-- matSort is a directive on the existing Bootstrap table: mat-table would take
        the striping and the #ownersTable / .ownerFullName selectors with it. -->
    <div class="table-responsive" id="ownersTable" *ngIf="!isEmpty">
      <table class="table table-striped"
            matSort
            [matSortActive]="activeSortColumn"
            [matSortDirection]="activeSortDirection"
            (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName" [data-tip]="owner.lastName + ', ' + owner.firstName"><a
            routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td [data-tip]="owner.address">{{ owner.address }}</td>
          <td [data-tip]="owner.city">{{ owner.city }}</td>
          <td [data-tip]="owner.telephone">{{ owner.telephone }}</td>
          <td [data-tip]="petNamesOf(owner)">
            <span *ngFor="let pet of owner.pets" class="petName">{{ pet.name }}</span>
          </td>
        </tr>
        </tbody>
      </table>

      <!-- Add Owner shares the pager's row: the pager's own controls sit on the
          right, so the empty left half is where the action belongs. -->
      <div class="owners-footer">
        <button *ngIf="isOwnersDataReceived" class="btn btn-default" (click)="addOwner()">Add Owner</button>
        <mat-paginator [length]="page.totalElements"
                      [pageIndex]="page.number"
                      [pageSize]="page.size"
                      [pageSizeOptions]="pageSizes"
                      (page)="onPage($event)"
                      aria-label="Select a page of owners">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
