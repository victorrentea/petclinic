<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form (ngSubmit)="searchByLastName(lastName)"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label" for="lastName">Last name </label>
          <div class="col-sm-10 owner-search-fields">
            <input class="form-control owner-search-input" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
            <button type="submit" class="btn btn-default">Find Owner</button>
          </div>
        </div>
      </div>

    </form>

    <div *ngIf="!isOwnersDataReceived && owners.length === 0" role="status">Loading owners...</div>
    <div *ngIf="noticeMessage" class="alert alert-warning" role="alert">{{noticeMessage}}</div>
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{errorMessage}}</div>
    <div *ngIf="isOwnersDataReceived && !errorMessage && totalElements === 0" role="status">
      No owners with last name starting with "{{appliedLastName}}"
    </div>
    <div class="table-responsive" id="ownersTable">
      <table class="table table-striped" matSort [matSortActive]="sortKey"
            [matSortDirection]="sortDirection" [matSortDisableClear]="true"
            (matSortChange)="onSortChange($event)" [attr.aria-busy]="!isOwnersDataReceived">
        <thead>
        <tr>
          <th mat-sort-header="name" sortActionDescription="Sort owners by name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city" sortActionDescription="Sort owners by city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
          <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
        </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="owners-controls">
      <button class="btn btn-default" (click)="addOwner()">Add Owner</button>
      <mat-paginator *ngIf="totalElements > 0 && !errorMessage" class="owners-pagination"
                    aria-label="Owners pages" [length]="totalElements" [pageIndex]="pageIndex"
                    [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 20]" [showFirstLastButtons]="true"
                    (page)="onPageChange($event)">
      </mat-paginator>
    </div>
  </div>
</div>
