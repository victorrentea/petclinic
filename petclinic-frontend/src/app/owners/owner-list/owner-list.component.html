<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get" id="search-owner-form" class="owner-search">
      <input class="form-control" maxlength="80" id="lastName" name="lastName" placeholder="Last name"
              aria-label="Last name" [(ngModel)]="lastName"/>
      <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">
        <span class="glyphicon glyphicon-search" aria-hidden="true"></span> Find Owner
      </button>
      <button type="button" class="btn btn-default" (click)="addOwner()">
        <span class="glyphicon glyphicon-plus" aria-hidden="true"></span> Add Owner
      </button>
      <app-owner-pager *ngIf="page?.totalElements > 0" [page]="page" [pageSizeOptions]="pageSizeOptions"
                        (pageChange)="onPage($event)"></app-owner-pager>
    </form>

    <ng-container *ngIf="page">
      <div *ngIf="page.totalElements === 0">No owners with LastName starting with "{{searchedLastName}}"</div>
      <div class="table-responsive" id="ownersTable" *ngIf="page.totalElements > 0">
        <table class="table table-striped" matSort matSortDisableClear
                [matSortActive]="sortActive" [matSortDirection]="sortDirection" (matSortChange)="onSort($event)">
          <colgroup>
            <col class="col-name"><col class="col-address"><col class="col-city"><col class="col-telephone">
            <col class="col-pets">
          </colgroup>
          <thead>
          <tr>
            <th mat-sort-header="name">Name
              <ng-container *ngTemplateOutlet="sortArrows; context: {$implicit: 'name'}"></ng-container>
            </th>
            <th>Address</th>
            <th mat-sort-header="city">City
              <ng-container *ngTemplateOutlet="sortArrows; context: {$implicit: 'city'}"></ng-container>
            </th>
            <th>Telephone</th>
            <th>Pets</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let owner of owners">
            <td class="ownerFullName">
              <a routerLink="/owners/{{owner.id}}">{{ owner.lastName }}, {{ owner.firstName }}</a>
            </td>
            <td>{{ owner.address }}</td>
            <td>{{ owner.city }}</td>
            <td>{{ owner.telephone }}</td>
            <td class="ownerPets">
              <div *ngFor="let pet of owner.pets">
                <span class="pet-type" aria-hidden="true"
                      [attr.data-tip]="pet.type?.name">{{ emojiOf(pet.type?.name) }}</span>
                <a routerLink="/pets/{{pet.id}}/edit">{{ pet.name }}</a>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
        <app-owner-pager [page]="page" [pageSizeOptions]="pageSizeOptions"
                          (pageChange)="onPage($event)"></app-owner-pager>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #sortArrows let-column>
  <span class="sort-arrows" aria-hidden="true">
    <span class="up" [class.lit]="isSorted(column, 'asc')"></span>
    <span class="down" [class.lit]="isSorted(column, 'desc')"></span>
  </span>
</ng-template>
