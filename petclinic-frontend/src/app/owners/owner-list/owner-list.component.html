<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/> <span class="help-inline"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find
            Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="totalElements === 0">No owners with LastName starting with "{{query.lastName}}"</div>
    <div class="table-responsive" id="ownersTable">
      <table *ngIf="totalElements > 0" class="table table-striped"
        matSort matSortDisableClear [matSortActive]="sortActive" [matSortDirection]="sortDirection"
        (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.firstName }} {{ owner.lastName }}</a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
            <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
            <span *ngIf="!owner.pets?.length">—</span>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="owners-footer">
        <button class="btn btn-default" (click)="addOwner()">Add Owner</button>
        <mat-paginator *ngIf="totalElements > 0" [length]="totalElements" [pageIndex]="query.page"
          [pageSize]="query.size" [pageSizeOptions]="pageSizeOptions" (page)="onPage($event)">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
