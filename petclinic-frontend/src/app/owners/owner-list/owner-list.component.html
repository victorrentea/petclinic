<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <div class="owners-search-row">
      <label for="lastName" class="sr-only">Last name</label>
      <input class="form-control" id="lastName" name="lastName" maxlength="80" placeholder="Last name"
              autocomplete="off" [(ngModel)]="lastName" (ngModelChange)="onLastNameTyped($event)"/>
    </div>

    <div id="ownersError" class="alert alert-danger" *ngIf="failed">The owners could not be loaded. Please try again.</div>
    <div id="noOwners" *ngIf="page && page.totalElements === 0">No owners with LastName starting with "{{query.lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="page && page.totalElements > 0">
      <table class="table table-striped" matSort matSortDisableClear
              [matSortActive]="query.sort" [matSortDirection]="query.direction" (matSortChange)="onSort($event)">
        <colgroup>
          <col class="col-name"><col class="col-address"><col class="col-city"><col class="col-telephone"><col class="col-pets">
        </colgroup>
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
            <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
          </td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="page.totalElements" [pageIndex]="query.page" [pageSize]="query.size"
                      [pageSizeOptions]="pageSizes" showFirstLastButtons
                      (page)="onPage($event)" aria-label="Owners per page"></mat-paginator>
    </div>
    <div class="owners-actions" *ngIf="page || failed">
      <button id="addOwner" class="btn btn-default" (click)="addOwner()">Add Owner</button>
    </div>
  </div>
</div>
