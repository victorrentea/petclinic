<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form id="search-owner-form" (ngSubmit)="search()">
      <input class="form-control" maxlength="80" id="lastName" name="lastName" placeholder="Last name"
        aria-label="Last name" [(ngModel)]="lastName"/>
      <button type="submit" class="btn btn-default"><span class="glyphicon glyphicon-search" aria-hidden="true"></span> Find Owner</button>
      <button id="addOwner" type="button" class="btn btn-default" routerLink="/owners/add">Add Owner</button>
    </form>

    <div *ngIf="errorMessage" id="ownersError" class="alert alert-danger">Could not load the owners: {{ errorMessage }}</div>
    <div *ngIf="page?.totalElements === 0" id="noOwners">No owners with last name starting with "{{ query.lastName }}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="page && page.totalElements > 0">
      <table class="table table-striped"
              matSort [matSortActive]="sortColumn" [matSortDirection]="sortDirection" matSortDisableClear
              (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of page.content">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active">{{ owner.firstName }} <strong>{{ owner.lastName }}</strong></a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
            <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
          </td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="page.totalElements" [pageIndex]="query.page - 1" [pageSize]="query.size"
                      [pageSizeOptions]="pageSizes" showFirstLastButtons (page)="onPage($event)"></mat-paginator>
    </div>
  </div>
</div>
