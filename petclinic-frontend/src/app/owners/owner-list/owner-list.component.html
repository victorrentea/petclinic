<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <div class="owner-search-row">
              <input class="form-control" size="30"
                maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
              <button type="submit" class="btn btn-default" (click)="search()">Find Owner</button>
            </div>
          </div>
        </div>
      </div>
    </form>

    <div *ngIf="isOwnersDataReceived && totalElements === 0">No owners with LastName starting with "{{lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="owners?.length > 0" [attr.aria-busy]="loading">
      <table class="table table-striped" matSort [matSortActive]="sort" [matSortDirection]="dir"
              matSortDisableClear (matSortChange)="onSortChange($event)">
        <colgroup>
          <col class="col-name"><col class="col-address"><col class="col-city">
          <col class="col-telephone"><col class="col-pets">
        </colgroup>
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.firstName }} {{ owner.lastName }}</a></td>
          <td [title]="owner.address">{{ owner.address }}</td>
          <td class="ownerCity">{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td class="ownerPets"><div *ngFor="let pet of owner.pets" [title]="pet.name">{{ pet.name }}</div></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="owners-footer">
      <button *ngIf="isOwnersDataReceived" class="btn btn-default" (click)="addOwner()">Add Owner</button>
      <mat-paginator *ngIf="totalElements > 0" [length]="totalElements" [pageSize]="size" [pageIndex]="page"
                      [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)">
      </mat-paginator>
    </div>
  </div>
</div>
