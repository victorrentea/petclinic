<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label" for="lastName">Last name </label>
          <div class="col-sm-10 owner-search-row">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/>
            <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find Owner</button>
          </div>
        </div>
      </div>

    </form>

    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    <div *ngIf="page?.content.length === 0" id="noOwners">
      No owners with last name starting with "{{ query.lastName }}"
    </div>
    <div class="table-responsive" id="ownersTable" *ngIf="page?.content.length">
      <table class="table table-striped" matSort matSortDisableClear matSortStart="asc"
              [matSortActive]="sortField" [matSortDirection]="sortDirection" (matSortChange)="sortBy($event)">
        <thead>
        <tr>
          <th mat-sort-header="name">Name</th>
          <th>Address</th>
          <th mat-sort-header="city">City</th>
          <th>Telephone</th>
          <th>Pets</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of page.content">
          <td class="ownerFullName">
            <a routerLink="/owners/{{owner.id}}">{{ owner.lastName }}, {{ owner.firstName }}</a>
          </td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
          <td>
            <div *ngFor="let pet of owner.pets">{{ pet.name }}</div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div class="owners-controls" *ngIf="page">
      <button class="btn btn-default" id="addOwner" (click)="addOwner()">Add Owner</button>
      <mat-paginator *ngIf="page.content.length" [length]="page.totalElements" [pageIndex]="pageIndex"
                      [pageSize]="pageSize" [pageSizeOptions]="pageSizes" (page)="changePage($event)">
      </mat-paginator>
      <nav class="owner-pages" aria-label="Pages" *ngIf="page.content.length">
        <ng-container *ngFor="let link of pageLinks">
          <span *ngIf="link === '…'" class="owner-pages-gap">…</span>
          <button *ngIf="link !== '…'" type="button" class="btn btn-link" (click)="goToPage(link)"
                  [attr.aria-current]="link === pageIndex + 1 ? 'page' : null">{{ link }}</button>
        </ng-container>
      </nav>
    </div>
  </div>
</div>
