<div class="container-fluid">
  <div class="container xd-container">
    <form method="get" class="owner-search-row" id="search-owner-form">
      <input class="form-control" maxlength="80" id="lastName" name="lastName" placeholder="Last name"
            aria-label="Last name" [(ngModel)]="lastName"/>
      <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find Owner</button>
      <button type="button" *ngIf="isOwnersDataReceived" class="btn btn-default" (click)="addOwner()">Add Owner</button>
    </form>

    <div *ngIf="isOwnersDataReceived && totalElements === 0">No owners with LastName starting with "{{lastName}}"</div>
    <div class="table-responsive" id="ownersTable" [hidden]="totalElements === 0">
      <table mat-table [dataSource]="owners" class="table table-striped"
            matSort matSortDisableClear [matSortActive]="query.sort" [matSortDirection]="query.dir"
            (matSortChange)="onSortChange($event)">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let owner" class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.firstName }} <b>{{ owner.lastName }}</b></a></td>
        </ng-container>
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let owner">{{ owner.address }}</td>
        </ng-container>
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>City</th>
          <td mat-cell *matCellDef="let owner">{{ owner.city }}</td>
        </ng-container>
        <ng-container matColumnDef="telephone">
          <th mat-header-cell *matHeaderCellDef>Telephone</th>
          <td mat-cell *matCellDef="let owner">{{ owner.telephone }}</td>
        </ng-container>
        <ng-container matColumnDef="pets">
          <th mat-header-cell *matHeaderCellDef>Pets</th>
          <td mat-cell *matCellDef="let owner"><div *ngFor="let pet of owner.pets">{{ pet.name }}</div></td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      <mat-paginator [length]="totalElements" [pageIndex]="query.page" [pageSize]="query.size"
                    [pageSizeOptions]="pageSizes" showFirstLastButtons (page)="onPage($event)">
      </mat-paginator>
    </div>
  </div>
</div>
