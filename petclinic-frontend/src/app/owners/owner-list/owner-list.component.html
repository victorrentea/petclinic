<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get" class="form-horizontal" id="search-owner-form" (ngSubmit)="search()">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" />
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default">Find Owner</button>
        </div>
      </div>
    </form>

    <div class="no-owners" *ngIf="ownerPage && ownerPage.totalElements === 0">
      No owners with LastName starting with "{{lastName}}"
    </div>

    <div class="table-responsive" id="ownersTable" *ngIf="ownerPage && ownerPage.totalElements > 0">
      <table mat-table [dataSource]="ownerPage.content" matSort matSortDisableClear
        [matSortActive]="sort" [matSortDirection]="dir" (matSortChange)="onSortChange($event)">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="NAME">Name</th>
          <td mat-cell *matCellDef="let owner" class="ownerFullName">
            <a routerLink="/owners/{{owner.id}}" (click)="onSelect(owner.id)">{{ owner | ownerName }}</a>
          </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let owner">{{ owner.address }}</td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="CITY">City</th>
          <td mat-cell *matCellDef="let owner">{{ owner.city }}</td>
        </ng-container>

        <ng-container matColumnDef="telephone">
          <th mat-header-cell *matHeaderCellDef>Telephone</th>
          <td mat-cell *matCellDef="let owner">{{ owner.telephone }}</td>
        </ng-container>

        <ng-container matColumnDef="pets">
          <th mat-header-cell *matHeaderCellDef>Pets</th>
          <td mat-cell *matCellDef="let owner">{{ owner.petNames.join(', ') }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="table-footer">
        <button class="btn btn-default" (click)="addOwner()">Add Owner</button>
        <mat-paginator [length]="ownerPage.totalElements" [pageSize]="size"
          [pageIndex]="page" [pageSizeOptions]="pageSizeOptions"
          (page)="onPageChange($event)"></mat-paginator>
      </div>
    </div>
  </div>
</div>
