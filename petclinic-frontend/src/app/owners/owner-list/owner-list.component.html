<div class="container-fluid">
  <div class="container xd-container">
    <h2>Owners</h2>

    <form method="get"
          class="form-horizontal" id="search-owner-form">
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label">Last name </label>
          <div class="col-sm-10">
            <input class="form-control" size="30"
              maxlength="80" id="lastName" name="lastName" [(ngModel)]="lastName" value=""/> <span class="help-inline"></span>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-default" (click)="searchByLastName(lastName)">Find
            Owner</button>
        </div>
      </div>

    </form>

    <div *ngIf="!owners || owners.length === 0">No owners with LastName starting with "{{lastName}}"</div>
    <div class="table-responsive" id="ownersTable" *ngIf="owners && owners.length > 0">
      <table class="table table-striped">
        <thead>
        <tr>
          <th><a href="javascript:void(0)" id="sortByName" (click)="sortBy('NAME')">Name {{ sortArrow('NAME') }}</a></th>
          <th>Address</th>
          <th><a href="javascript:void(0)" id="sortByCity" (click)="sortBy('CITY')">City {{ sortArrow('CITY') }}</a></th>
          <th>Telephone</th>
        </tr>
        </thead>

        <tbody>
        <tr *ngFor="let owner of owners">
          <td class="ownerFullName"><a routerLink="/owners/{{owner.id}}" routerLinkActive="active"
            (click)="onSelect(owner)">{{ owner.lastName }}, {{ owner.firstName }}</a></td>
          <td>{{ owner.address }}</td>
          <td>{{ owner.city }}</td>
          <td>{{ owner.telephone }}</td>
        </tr>
        </tbody>
      </table>

      <mat-paginator id="ownersPaginator"
        [length]="totalElements"
        [pageSize]="criteria.size"
        [pageIndex]="criteria.page"
        [pageSizeOptions]="pageSizes"
        (page)="onPage($event)">
      </mat-paginator>

      <div>
        <button *ngIf="isOwnersDataReceived" class="btn btn-default" (click)="addOwner()">Add Owner</button>
      </div>
    </div>
  </div>
</div>
