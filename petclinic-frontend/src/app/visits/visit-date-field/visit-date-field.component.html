<div class="form-group has-feedback" [class.has-success]="date.dirty && date.valid" [class.has-error]="date.dirty && !date.valid">
  <label class="col-sm-2 control-label" for="visitDate">Date</label>
  <div class="col-sm-10">
    <input id="visitDate" matInput [matDatepicker]="visitDateDatepicker" required [ngModel]="visitDate | date:'yyyy-MM-dd'" [min]="dateRange.min" [max]="dateRange.max" name="date" #date="ngModel">
    <mat-datepicker-toggle matSuffix [for]="visitDateDatepicker"></mat-datepicker-toggle>
    <mat-datepicker #visitDateDatepicker></mat-datepicker>
    <span class="glyphicon form-control-feedback" [class.glyphicon-ok]="date.valid" [class.glyphicon-remove]="!date.valid" aria-hidden="true"></span>
    <span class="help-block" *ngIf="date.dirty && date.hasError('required')">Date is required</span>
    <span class="help-block" *ngIf="date.dirty && date.hasError('matDatepickerMin')">A visit cannot predate the pet's birth ({{ dateRange.minLabel }})</span>
    <span class="help-block" *ngIf="date.dirty && date.hasError('matDatepickerMax')">A visit cannot be booked more than a year ahead ({{ dateRange.maxLabel }})</span>
  </div>
</div>
