<div class="form-group has-feedback" [class.has-success]="dateModel.dirty && dateModel.valid"
    [class.has-error]="dateModel.dirty && !dateModel.valid">
  <label class="col-sm-2 control-label">Date</label>
  <div class="col-sm-10">
    <input matInput [matDatepicker]="visitDateDatepicker" required [ngModel]="date | date:'yyyy-MM-dd'" name="date"
      #dateModel="ngModel" [min]="petBirthDate" [max]="maxVisitDate">
    <mat-datepicker-toggle matSuffix [for]="visitDateDatepicker"></mat-datepicker-toggle>
    <mat-datepicker #visitDateDatepicker></mat-datepicker>
    <span class="glyphicon form-control-feedback" [class.glyphicon-ok]="dateModel.valid"
          [class.glyphicon-remove]="!dateModel.valid" aria-hidden="true"></span>
    <span class="help-block" *ngIf="dateModel.dirty && dateModel.hasError('required')">Date is required</span>
    <span class="help-block" *ngIf="dateModel.dirty && dateModel.hasError('matDatepickerMin')">
      The visit cannot predate the pet's birth</span>
    <span class="help-block" *ngIf="dateModel.dirty && dateModel.hasError('matDatepickerMax')">
      The visit cannot be more than one year ahead</span>
  </div>
</div>
