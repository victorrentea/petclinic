<div class="form-group has-feedback" [class.has-success]="date.dirty && date.valid" [class.has-error]="date.dirty && !date.valid">
  <label class="col-sm-2 control-label">Date</label>
  <div class="col-sm-10">
    <input matInput [matDatepicker]="visitDateDatepicker" required [ngModel]="visitDate | date:'yyyy-MM-dd'" name="date" #date="ngModel"
      [min]="petBirthDate" [max]="maxVisitDate">
    <mat-datepicker-toggle matSuffix [for]="visitDateDatepicker"></mat-datepicker-toggle>
    <mat-datepicker #visitDateDatepicker></mat-datepicker>
    <span class="glyphicon form-control-feedback" [class.glyphicon-ok]="date.valid" [class.glyphicon-remove]="!date.valid" aria-hidden="true"></span>
    <span class="help-block" *ngIf="date.dirty && date.hasError('required')">Date is required</span>
    <span class="help-block visit-date-error" *ngIf="date.dirty && date.hasError('matDatepickerMin')">Date cannot be before the pet's birth date ({{ petBirthDate }})</span>
    <span class="help-block visit-date-error" *ngIf="date.dirty && date.hasError('matDatepickerMax')">Date cannot be more than one year ahead ({{ maxVisitDate }})</span>
  </div>
</div>
