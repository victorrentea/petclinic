<div class="container-fluid">
  <div class="container xd-container">
    <h2>Visits</h2>

    <div *ngIf="errorMessage" id="visitsError" class="alert alert-danger">
      Could not load the visits: {{ errorMessage }}
    </div>
    <div *ngIf="page?.totalElements === 0" class="no-visits">
      No visits found.
    </div>

    <div class="table-responsive" id="visitsTable" *ngIf="page && page.totalElements > 0">
      <table class="table table-striped"
        matSort [matSortActive]="sortColumn" [matSortDirection]="sortDirection" matSortDisableClear
        (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="date">Date</th>
          <th mat-sort-header="description">Description</th>
          <th mat-sort-header="pet">Pet</th>
          <th mat-sort-header="owner">Owner</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let visit of page.content">
          <td class="visit-date">{{ visit.date }}</td>
          <td class="visit-description">{{ visit.description }}</td>
          <td class="visit-pet">{{ visit.petName }}</td>
          <td class="visit-owner">
            <a class="owner-link" [routerLink]="'/owners/' + visit.ownerId">
              {{ visit.ownerFirstName }} {{ visit.ownerLastName }}
            </a>
          </td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="page.totalElements" [pageIndex]="query.page - 1" [pageSize]="query.size"
        [pageSizeOptions]="pageSizes" showFirstLastButtons (page)="onPage($event)"></mat-paginator>
    </div>
  </div>
</div>
