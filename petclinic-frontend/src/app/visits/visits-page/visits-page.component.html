<div class="container-fluid">
  <div class="container xd-container">
    <h2>Visits</h2>

    <div *ngIf="isDataReceived && visits.length === 0" class="no-visits">
      No visits found.
    </div>

    <div class="table-responsive" id="visitsTable" *ngIf="visits.length > 0">
      <table class="table table-striped" matSort matSortDisableClear
        [matSortActive]="sortColumn" [matSortDirection]="sortDirection" (matSortChange)="onSort($event)">
        <thead>
        <tr>
          <th mat-sort-header="date">Date</th>
          <th mat-sort-header="description">Description</th>
          <th mat-sort-header="pet">Pet</th>
          <th mat-sort-header="owner">Owner</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let visit of visits">
          <td class="visit-date">{{ visit.date }}</td>
          <td class="visit-description">{{ visit.description }}</td>
          <td class="visit-pet">{{ visit.petName }}</td>
          <td class="visit-owner">
            <a class="owner-link" [routerLink]="'/owners/' + visit.ownerId">
              {{ visit.ownerFirstName }} {{ visit.ownerLastName }}
            </a>
          </td>
        </tr>
        </tbody>
      </table>
      <mat-paginator [length]="totalElements" [pageIndex]="page" [pageSize]="size"
        [pageSizeOptions]="pageSizes" (page)="onPage($event)" showFirstLastButtons
        aria-label="Visits per page">
      </mat-paginator>
    </div>
  </div>
</div>
