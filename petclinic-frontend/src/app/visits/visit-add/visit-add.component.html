<div class="container-fluid">
  <div class="container xd-container">

    <h2>New Visit</h2>

    <b>Pet</b>
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Name</th>
        <th>Birth Date</th>
        <th>Type</th>
        <th>Owner</th>
      </tr>
      </thead>
      <tr>
        <td>{{ currentPet.name }}</td>
        <td>{{ currentPet.birthDate }}</td>
        <td>{{ currentPetType.name }}</td>
        <td>{{ currentOwner.firstName }} {{ currentOwner.lastName }}</td>
      </tr>

    </table>

    <app-visit-form [visit]="visit" submitLabel="Add Visit" (submitted)="onSubmit($event)" (back)="gotoOwnerDetail()"></app-visit-form>

    <br/>
    <div class="col-12 text-left">
      <p>
        <b>Previous Visits</b>
      </p>
    </div>
    <br/>
    <div class="container">
      <div class="row">
        <div class="col-12 text-center">
          <app-visit-list [visits]="currentPet.visits"></app-visit-list>
        </div>
      </div>
    </div>
  </div>
</div>
