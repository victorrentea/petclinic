<div class="container-fluid">
  <div class="container xd-container">

    <h2>Edit Visit</h2>

    <b>Pet</b>
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Name</th>
        <th>Birth Date</th>
        <th>Type</th>
        <th>Owner</th>
      </tr>
      </thead>
      <tr>
        <td>{{ currentPet.name }}</td>
        <td>{{ currentPet.birthDate }}</td>
        <td>{{ currentPetType.name }}</td>
        <td>{{ currentOwner.firstName }} {{ currentOwner.lastName }}</td>
      </tr>

    </table>

    <app-visit-form [visit]="visit" submitLabel="Update Visit" (submitted)="onSubmit($event)" (back)="gotoOwnerDetail()"></app-visit-form>
  </div>
</div>
