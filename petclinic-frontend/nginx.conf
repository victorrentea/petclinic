# Needed by proxy-backend.conf: a WebSocket upgrade has to be forwarded verbatim, and a
# plain request must not carry a stray Connection: upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # The default port the Angular dev server uses, kept inside the container so the
    # published host port is the only thing that ever varies between instances.
    listen 4200;

    # The idle reaper decides the stack is abandoned from this file's mtime, so it must
    # record real traffic and nothing else. The two endpoints below are excluded on
    # purpose: either one alone would keep every instance alive forever.
    access_log /activity/access.log;

    root /usr/share/nginx/html;
    index index.html;

    # A reviewer may open this from anywhere, so the wire matters more than the CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
                application/xml image/svg+xml font/ttf font/otf application/font-woff;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The app asks whether a collector is listening by POSTing here and treating anything
    # under 500 as yes. There is no collector in this stack, so the honest answer is a
    # 5xx — a 204 or a 405 would switch browser tracing on and point its exporter at a
    # page of HTML.
    location = /v1/traces {
        access_log off;
        return 502;
    }

    # CORS is open so the review page — which may be a file:// document — can ask whether
    # this instance is alive before it offers a link into it.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Access-Control-Allow-Origin "*";
        return 200 "ok\n";
    }

    # environment.docker.ts points the app at a relative /api/, so this is what joins the
    # two containers. Same-origin, which is why no CORS config is involved.
    location /api/       { include /etc/nginx/proxy-backend.conf; }
    # Everything else the backend serves. Without these the SPA fallback below answers
    # them with index.html and a 200, which is a worse failure than a 404.
    location /actuator/  { include /etc/nginx/proxy-backend.conf; }
    location /v3/api-docs { include /etc/nginx/proxy-backend.conf; }
    location /swagger-ui { include /etc/nginx/proxy-backend.conf; }
    location /mcp        { include /etc/nginx/proxy-backend.conf; }

    # A missing asset must 404, not fall through to index.html: a bundle that answers with
    # HTML fails as `Unexpected token '<'`, which says nothing about what went wrong.
    location ~* \.(?:js|css|map|json|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
        try_files $uri =404;
    }

    # Angular routes like /pets/2/edit are real URLs to the router but not files on disk.
    # Without this fallback a deep link 404s on first load, which is exactly what the
    # review page's transcript links do.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
