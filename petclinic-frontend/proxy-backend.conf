# Shared by every location that belongs to the backend rather than to the SPA.
proxy_http_version 1.1;

# $http_host, not $host: the published port is random and never the default, so $host —
# which drops the port — would make any absolute URL the backend builds point nowhere.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# This is a performance-training PetClinic: endpoints are slow here on purpose, and the
# 60s default would turn a deliberately slow demo into a 504.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 20m;

# Through a variable, so the name is re-resolved against docker's DNS. A literal upstream
# is resolved once at config load, and a backend recreate would then 502 until nginx
# itself was restarted.
set $upstream backend;
proxy_pass http://$upstream:8080;
