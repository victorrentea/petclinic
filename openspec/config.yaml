schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - >-
      When the change touches the user interface, show the new screen as a picture, never as
      ASCII art. Snapshot the current page with `node scripts/ui-mockup.cjs capture <route>
      openspec/changes/<change>/mockup/<screen>.html` (frontend on :4200), edit that HTML into
      the proposed screen with the app's own styles and design-system widgets, then
      `node scripts/ui-mockup.cjs shot <screen>.html <screen>.png`. Embed the PNG in
      proposal.md under "What Changes", linking the HTML next to it. Use the smallest data
      that still shows the change. Open the PNG to check it before presenting the proposal.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
