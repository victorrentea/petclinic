schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules: injected into `openspec instructions <artifact>` when that artifact is written
rules:
  proposal:
    - >-
      Write for a product owner or clinic user who has never heard of JSON: it is read
      in a business meeting. No JSON, DTOs, endpoints, HTTP codes, class/file names,
      SQL, indexes or framework names; describe what users see and do, with examples
      from the real data. Technical detail goes to design.md, behaviour to the specs.
    - Say explicitly what is NOT part of the change.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
