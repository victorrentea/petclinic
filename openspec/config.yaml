schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
rules:
  proposal:
    - Audience is product owners and business analysts, not engineers - write in plain language a non-technical reader understands
    - No JSON, HTTP verbs, status codes, class/file names, SQL, collations or library names - move every such detail to design.md
    - Describe behavior as the user sees it on screen (what they click, what they see), with concrete examples from real demo data
    - Include a static visual (annotated UI mockup, chart or diagram) as an SVG under the change's images/ folder, embedded in the proposal
    - Also include an animated SVG (CSS keyframes, loops on its own) showing the main user flow step by step, with a caption per step
    - Fill mockups with real demo data queried from the database, label them as mockups, and render-check them in a browser before embedding
  design:
    - Hold every technical consequence the proposal omits - API contract and breaking changes, parameters, error codes, affected code, callers to adapt
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
