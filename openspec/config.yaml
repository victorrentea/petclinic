schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - "Write for a non-technical Product Owner audience. Describe only observable business/user behavior (what changes on screen, in a workflow, or for a user/role)."
    - "Do not use technical jargon or implementation terms: no framework, library, or language names (e.g. Spring, Angular, TypeScript, JSON), no code identifiers (class/method/endpoint/DTO names), no data-shape/serialization details (e.g. Page<T>, response envelope), and no HTTP status codes."
    - "If a change is technically breaking for other systems/consumers, say so in plain language (e.g. other tools reading this list will need to be updated) and point to design.md for the technical specifics; do not explain the mechanism here."
  design:
    - "Capture all technical/implementation detail here instead of in proposal.md, including affected classes/endpoints/files, API/data-shape changes, frameworks and libraries used, validation/whitelisting mechanics, HTTP status codes, and migration/rollback mechanics."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
