schema: spec-driven

# Project context: applies to every OpenSpec artifact and workflow
context: |
  Never ask the user about decisions that are cheap to change after the business sees the
  demo: UI nitpicks (labels, wording, colours, layout, placement, default page size, icons).
  Pick a sensible default, note it as an assumption in the artifact, and move on; the user
  will discover and adjust these in the demo. Ask only about what changes scope, data,
  compatibility or acceptance criteria.

# Per-artifact rules: injected into `openspec instructions <artifact>` when that artifact is written
rules:
  proposal:
    - >-
      Write for a product owner or clinic user who has never heard of JSON: it is read
      in a business meeting. No JSON, DTOs, endpoints, HTTP codes, class/file names,
      SQL, indexes or framework names; describe what users see and do, with examples
      from the real data. Technical detail goes to design.md, behaviour to the specs.
    - Say explicitly what is NOT part of the change.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
