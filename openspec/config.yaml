schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Per-artifact rules
rules:
  proposal:
    - "proposal.md is read by a non-technical Product Owner. Assume they do not know JSON, SQL, HTTP or this codebase's file layout."
    - "Keep out of the proposal: class/type/file/table/column names, code identifiers and paths, JSON or SQL snippets, HTTP verbs, status codes and query parameters, library/framework/annotation names, index and migration details, generated-artifact and test class names."
    - "Say instead what a user or the business notices: what the workflow does before and after, what gets faster, what is deliberately not delivered and why, who is affected, what must ship together, what a revert costs."
    - "Move every technical detail you cut into design.md (a 'Technical Impact' section if it has no natural home) - never delete it, and never let it back into the proposal. When design.md is skipped, it goes into tasks.md."
    - "Word the Capabilities section in plain language; name a breaking change in business terms and leave the enumeration to design.md."
  design:
    - "design.md is the home for everything technical that the proposal must not carry: contract shapes, identifiers, file and caller lists, SQL, indexes, generated artifacts."
