# Every JUnit Jupiter test is displayed as a sentence: `create_withoutVet` reads "create without vet".
# The display name is what a sequence diagram is titled with (SequenceTraceExtension), so naming it
# here — once, for the whole suite — keeps every picture readable without a per-class opt-in.
junit.jupiter.displayname.generator.default=victor.training.petclinic.tools.PrettyTestNames
