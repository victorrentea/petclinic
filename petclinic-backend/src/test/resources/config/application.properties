# Owners sort by name in the DB collation; pin it so a Linux runner whose LANG is C.UTF-8
# does not put "Łukasz" after "Wendy" (OwnerListTest.accentedNamesSortWhereReadersExpectThem).
zonky.test.database.postgres.initdb.properties.lc-collate=en_US.UTF-8
zonky.test.database.postgres.initdb.properties.lc-ctype=en_US.UTF-8
