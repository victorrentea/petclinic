# Every Spring test starts on an EMPTY database: the schema and the reference rows (pet types,
# specialties), nothing else. The seed — Kevin, Milton, the vets, the admin user — is not loaded
# unless the test declares it: @DefaultFixture (victor.training.petclinic.DefaultFixture), or
# @Sql of a db/fixtures/<name>.sql. What a test starts on is then written on the test itself,
# which is what the review page's Tests tab draws as the test's DB fixture dot.
#
# In config/, not beside it: Spring Boot reads classpath:/config/application.properties on top
# of classpath:/application.properties, so this overrides two keys and inherits the rest of the
# main file. A test-resources application.properties would SHADOW the main one entirely.
spring.flyway.locations=classpath:db/migration,classpath:db/reference

# A fresh copy of that database for every test method (Zonky clones it from a template
# migrated once, ~ms). Without it, a test that commits — a RANDOM_PORT test, a Cucumber
# scenario, anything that is not @Transactional — leaves its rows to whichever test comes
# next on the same cached context, and "starts empty" would be true only of the first.
zonky.test.database.refresh=after_each_test_method
