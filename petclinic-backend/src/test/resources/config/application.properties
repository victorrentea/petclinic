# Loaded beside the main application.properties (classpath:/config/ is read in addition, not instead).
# The embedded test database sorts like a person would: ICU English, whatever locale the machine
# runs under - CI's C.UTF-8 put 'Lukasz' with a stroke after 'Mister'.
zonky.test.database.postgres.initdb.properties.locale-provider=icu
zonky.test.database.postgres.initdb.properties.icu-locale=en
