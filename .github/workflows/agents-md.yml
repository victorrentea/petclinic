name: AGENTS.md layout

# The point of the windows job: prove that what a Windows contributor actually gets
# from `git clone` is a real AGENTS.md with real content — not a text file holding a
# symlink target. Git for Windows only materialises symlinks when core.symlinks=true
# (installer checkbox, off by default) plus Developer Mode or admin rights; without
# them a committed symlink arrives as its target path in plain text, and every agent
# reads that string as its complete instructions. Silent failure, so it needs a test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md / CLAUDE.md layout
        shell: bash
        run: bash scripts/check-agents-md.sh

      - name: Assert the Windows checkout is a real file, not a symlink stub
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          echo "core.symlinks = $(git config --get core.symlinks || echo '<unset>')"
          for f in AGENTS.md petclinic-backend/AGENTS.md petclinic-test/AGENTS.md; do
            bytes=$(wc -c <"$f" | tr -d ' ')
            echo "$f -> ${bytes} bytes"
            if [ "$bytes" -lt 200 ]; then
              echo "::error file=$f::Only ${bytes} bytes after a Windows checkout — this is a symlink stub, not instructions."
              exit 1
            fi
          done
          echo "OK: AGENTS.md survives a Windows checkout intact."
