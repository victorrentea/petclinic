# What it blocks, concretely: useDefault pulls in gitleaks' built-in rules, so staging
#     spring.ai.openai.api-key=sk-<20 chars>T3BlbkFJ<20 chars>   ->  rule "openai-api-key"
# aborts the commit; demanded instead is a placeholder resolved at runtime, e.g.
#     spring.ai.openai.api-key=${OPENAI_API_KEY}
#
# Extend gitleaks' default rules, but allowlist the single PUBLIC demo MCP JWT used across
# the PetClinic workshop. It encodes {"sub":"1","name":"George Franklin",...}, authenticates
# only against the localhost MCP server, and is already committed elsewhere in the repo
# (petclinic-claude-chatbot/.mcp.json, McpHttpSecurityTest). It is NOT a real credential.
# The allowlist is scoped to exactly this token's payload — any other JWT is still caught.
[extend]
useDefault = true

[[allowlists]]
description = "Public demo MCP JWT (George Franklin, sub=1, localhost only)"
regexes = [
  '''eyJzdWIiOiIxIiwibmFtZSI6Ikdlb3JnZSBGcmFua2xpbi[A-Za-z0-9_-]*''',
]

# The RFC 8693 token-exchange demo in .mcp.json: {"iss":"https://auth.petclinic.example",
# "sub":"1","name":"Kevin McCallister",...,"act":{"sub":"claude-code"}}, signed with the
# published demo key. Scoped to this issuer + subject, like the token above.
[[allowlists]]
description = "Public demo token-exchange JWT (Kevin McCallister, sub=1, auth.petclinic.example)"
regexes = [
  '''eyJpc3MiOiJodHRwczovL2F1dGgucGV0Y2xpbmljLmV4YW1wbGUiLCJzdWIiOiIxIiwibmFtZSI6IktldmluIE1jQ2FsbGlzdGVy[A-Za-z0-9_-]*''',
]
