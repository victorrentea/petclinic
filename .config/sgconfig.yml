# ast-grep — structural lint rules that enforce conventions written in CLAUDE.md.
# Run manually:  sg scan -c .config/sgconfig.yml
# Test rules:    sg test -c .config/sgconfig.yml
#
# What it flags, concretely (rule no-lombok, on any petclinic-backend source):
#     import lombok.Getter;       <- error: Lombok is not used in petclinic-backend
# demanded instead: the accessor, constructor or Logger field written by hand.
ruleDirs:
  - ../.ast-grep/rules
testConfigs:
  - testDir: ../.ast-grep/rule-tests
