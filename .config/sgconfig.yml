# ast-grep — structural lint rules that enforce conventions written in CLAUDE.md.
# Run manually:  sg scan -c .config/sgconfig.yml
# Test rules:    sg test -c .config/sgconfig.yml
#
# What it flags, concretely (rule no-lombok-data, on rest/dto/SpecialtyDto.java):
#     @Data                       <- warning: not on CLAUDE.md's allowed Lombok list
#     public class SpecialtyDto {
# demanded instead:
#     @Getter @Setter
#     public class SpecialtyDto {
ruleDirs:
  - ../.ast-grep/rules
testConfigs:
  - testDir: ../.ast-grep/rule-tests
